<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chess Cheating Signals — 440×280 · тёмная доска</title>
    <style>
{{FILE:_tile.css}}
      /* ─── вариант фона: тёмная доска ─── */
      .tile {
        background: var(--board);
      }
      /* клетки доски — едва заметная фактура, как на тёмном макете в герое */
      .tile::before {
        inset: 0;
        background-image: conic-gradient(
          rgba(255, 255, 255, 0.045) 0 25%,
          transparent 0 50%,
          rgba(255, 255, 255, 0.045) 0 75%,
          transparent 0
        );
        background-size: 70px 70px;
      }
      /* свет падает на фигуру слева */
      .tile::after {
        left: -40px;
        top: -70px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(129, 182, 76, 0.55),
          rgba(129, 182, 76, 0.13) 45%,
          transparent 70%
        );
      }
    </style>
  </head>

{{FILE:_tile.html}}

</html>
