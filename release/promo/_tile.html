<div class="tile">
  <div class="figure"><img src={{LOGO_BIG}} alt="" /></div>

  <div class="copy">
    <div class="eyebrow">Chess Cheating Signals</div>
    <h1>See who you are<br /><span class="grad">actually playing</span></h1>
    <p class="what">
      <b>Free extension for chess.com.</b> Badges your opponent's card from their last hours of
      play.
    </p>

    <div class="signals">
      <svg width="55" height="17" viewBox="0 0 38 12" role="img" aria-label="LUCKY">
        <rect width="38" height="12" rx="2" fill="#fa412d" />
        <text x="19" y="9" text-anchor="middle" fill="#000" font-family="Inter, sans-serif"
          font-size="8" font-weight="700" letter-spacing="0.3">LUCKY</text>
      </svg>
      <svg width="42" height="17" viewBox="0 0 29 12" role="img" aria-label="NEW">
        <rect width="29" height="12" rx="2" fill="#ffe159" />
        <text x="14.5" y="9" text-anchor="middle" fill="#000" font-family="Inter, sans-serif"
          font-size="8" font-weight="700" letter-spacing="0.3">NEW</text>
      </svg>
      <svg width="44" height="17" viewBox="0 0 30 12" role="img" aria-label="HIGH">
        <rect width="30" height="12" rx="2" fill="#9d0202" />
        <text x="15" y="9" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif"
          font-size="8" font-weight="700" letter-spacing="0.3">HIGH</text>
      </svg>
      <svg width="46" height="17" viewBox="0 0 32 12" role="img" aria-label="COLD">
        <rect width="32" height="12" rx="2" fill="#93ea5d" />
        <text x="16" y="9" text-anchor="middle" fill="#000" font-family="Inter, sans-serif"
          font-size="8" font-weight="700" letter-spacing="0.3">COLD</text>
      </svg>
    </div>
  </div>
</div>
